# Render Blueprint – ingyenes demó tárhely (Frankfurt) a backendnek és az éttermi panelnek.
# Létrehozás: Render → New → Blueprint → ez a repó. A panel PIN-t a Render ott kéri be.
# Ingyenes csomagon a szerver 15 perc forgalom nélkül elalszik (ébredés kb. 1 perc), és
# újraindításkor az adatbázis törlődik – demóhoz megfelelő, élesben fizetős csomag kell.
services:
  - type: web
    name: erdens-kebab-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PANEL_PIN_MONOR
        sync: false
